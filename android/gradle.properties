# Memory settings tuned for 8GB RAM Windows environment
org.gradle.jvmargs=-Xmx3584m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options=-Xmx512m -XX:MaxMetaspaceSize=512m

# Disable Virtual File System watching to prevent non-paged pool exhaustion on Windows
org.gradle.vfs.watch=false

# Prevent parallel workers from spiking RAM
org.gradle.workers.max=1
org.gradle.parallel=false
android.useAndroidX=true


