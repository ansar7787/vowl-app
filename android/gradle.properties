# Capped memory at 2GB because Windows is out of physical RAM (8GB total)
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options=-Xmx1024m -XX:MaxMetaspaceSize=256m

# CRITICAL FOR 8GB MACHINES: Prevent parallel workers from spiking RAM
org.gradle.workers.max=1
org.gradle.parallel=false
android.useAndroidX=true

