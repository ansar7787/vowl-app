name: vowl
description: "Gamified English learning adventure with interactive quests, AI speech analysis, and 100+ learning games"
publish_to: 'none'
version: 1.0.5+8

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # ===========================================================================
  # State Management & Architectural Infrastructure
  # ===========================================================================
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  get_it: ^9.2.1

  # ===========================================================================
  # Firebase Ecosystem & Cloud Backend
  # ===========================================================================
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  cloud_functions: ^6.3.3
  firebase_storage: ^13.3.0
  firebase_messaging: ^16.2.0
  firebase_analytics: ^12.3.0
  firebase_crashlytics: ^5.2.0
  firebase_remote_config: ^6.4.0
  firebase_app_check: ^0.4.3

  # ===========================================================================
  # Authentication, Identity & Device Security
  # ===========================================================================
  google_sign_in: ^7.2.0
  safe_device: ^1.1.5

  # ===========================================================================
  # Navigation & Routing
  # ===========================================================================
  go_router: ^17.1.0

  # ===========================================================================
  # Responsive Layout, Typography & Visual Polish
  # ===========================================================================
  flutter_screenutil: ^5.9.3
  auto_size_text: ^3.0.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  confetti: ^0.8.0
  flutter_animate: ^4.5.2
  flutter_svg: ^2.0.10
  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.8

  # ===========================================================================
  # Audio, Speech & Media Engines
  # ===========================================================================
  audioplayers: ^6.5.1
  flutter_tts: ^4.2.5
  speech_to_text: ^7.1.0
  record: ^6.2.1
  image_picker: ^1.2.1

  # ===========================================================================
  # Google ML Kit (On-Device Intelligence)
  # ===========================================================================
  google_mlkit_translation: ^0.14.0

  # ===========================================================================
  # Monetization, Subscriptions & Store Engagement
  # ===========================================================================
  google_mobile_ads: ^9.1.0
  razorpay_flutter: ^1.4.1
  in_app_purchase: ^3.2.0
  in_app_review: ^2.0.9

  # ===========================================================================
  # Hardware, Network Connectivity & System Notifications
  # ===========================================================================
  haptic_feedback: ^0.6.4+3
  permission_handler: ^12.0.1
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1
  path_provider: ^2.1.3
  share_plus: ^13.3.1
  internet_connection_checker_plus: ^3.1.1
  flutter_native_splash: ^2.3.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.0.2

  # ===========================================================================
  # Persistence, Environment, Utilities & Localization
  # ===========================================================================
  shared_preferences: ^2.5.5
  flutter_dotenv: ^6.0.0
  intl: ^0.20.2
  collection: ^1.19.0
  clock: ^1.1.2
  meta: ^1.17.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ===========================================================================
  # Code Quality & Static Analysis
  # ===========================================================================
  flutter_lints: ^6.0.0

  # ===========================================================================
  # Automated Testing (Unit & State Management)
  # ===========================================================================
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

  # ===========================================================================
  # Asset Generation & Packaging Utilities
  # ===========================================================================
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/appstore/app_store_light.png"
  adaptive_icon_background: "assets/images/android_adaptive/background.png"
  adaptive_icon_foreground: "assets/images/android_adaptive/foreground.png"
  adaptive_icon_monochrome: "assets/images/android_adaptive/monochrome.png"
  min_sdk_android: 26 # android min sdk min:16, aligned with production minSdk 26
  web:
    generate: false
    image_path: "assets/images/appstore/app_store_light.png"
    background_color: "#6366F1"
    theme_color: "#6366F1"
  windows:
    generate: true
    image_path: "assets/images/appstore/app_store_light.png"
    icon_size: 48 # min:48, max:256, default: 48

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/vowl_splash_logo.png"
  color_dark: "#0F172A"
  image_dark: "assets/images/vowl_splash_logo.png"

  android_12:
    image: "assets/images/vowl_splash_logo.png"
    icon_background_color: "#FFFFFF"
    image_dark: "assets/images/vowl_splash_logo.png"
    icon_background_color_dark: "#0F172A"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/illustrations/
    - assets/images/vowly_head.webp
    - assets/images/vowl_logo.webp
    - assets/images/vowl_splash_logo.png
    - assets/images/appstore/
    - assets/images/playstore/
    - assets/icons/
    - assets/sounds/
    - assets/translations/
    - assets/curriculum/accent/
    - assets/curriculum/grammar/
    - assets/curriculum/listening/
    - assets/curriculum/reading/
    - assets/curriculum/roleplay/
    - assets/curriculum/speaking/
    - assets/curriculum/vocabulary/
    - assets/curriculum/writing/
    - assets/curriculum/elite_mastery/
    - assets/curriculum/arena/word_clash/
    - assets/curriculum/arena/phrase_duel/
    - assets/curriculum/arena/sentence_strike/
    - assets/curriculum/arena/context_blitz/
    - assets/curriculum/calendar/
    - assets/curriculum/daily_words/
    - assets/images/mascot/
    - assets/legal/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Outfit-Black.ttf
          weight: 900
    - family: Spectral
      fonts:
        - asset: assets/fonts/Spectral-Regular.ttf
        - asset: assets/fonts/Spectral-Medium.ttf
          weight: 500
        - asset: assets/fonts/Spectral-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Spectral-Bold.ttf
          weight: 700
