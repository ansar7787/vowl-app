# =============================================================================
# Static Analysis & Code Quality Configuration
# =============================================================================
# Defines lint rules and analyzer settings for the Vowl production codebase.
# Extends Google's recommended Flutter lints to enforce consistency and safety.
#
# Reference: https://dart.dev/guides/language/analysis-options
# =============================================================================

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - scripts/**

linter:
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule
